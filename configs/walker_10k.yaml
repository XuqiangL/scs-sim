# Starlink-like multi-shell Walker-delta constellation targeting ~10000 sats.
# Phase 1â€?: orbits + +Grid/GSL topology + eclipse/atmosphere stubs.
#
# Notation per shell: i : T/P/F  (inclination : total / planes / phasing)
# Total T = 10008. Demo may subsample via demo.max_sats.

name: walker_10k
description: >
  Multi-shell LEO compute constellation inspired by published Starlink-like
  Walker-delta shells (mid-inclination dense planes + polar). Configured for
  10008 satellites; set demo.max_sats to run a faster subset.

epoch: "2026-09-06T00:00:00Z"
propagator: kepler_j2_gpu   # kepler_j2 | sgp4 | orekit (stub)

catalog:
  fetch: false
  cache_path: out/starlink.tle
  tle_path: tests/fixtures/starlink_sample.tle

earth:
  model: wgs84

demo:
  steps: 12
  dt_seconds: 60
  # Spread 4 planes around the first shell so GS see sats; intra-plane +Grid stays.
  subsample: spread_planes
  max_sats: 100
  output: out/ephemeris_demo.csv
  network: true
  topology_steps: 4
  topology_output: out/topology_demo.json
  eclipse_columns: true
  environment_output: out/environment_demo.csv
  compute_output: out/compute_schedule.csv

isl:
  pattern: plus_grid
  max_range_km: 2500
  earth_occlusion: true
  fill_geometric: true
  max_degree: 4

gsl:
  min_elevation_deg: 25
  max_attach: 2

ground_stations:
  - {id: seattle, lat_deg: 47.6062, lon_deg: -122.3321, alt_km: 0.10}
  - {id: london, lat_deg: 51.5074, lon_deg: -0.1278, alt_km: 0.05}
  - {id: tokyo, lat_deg: 35.6762, lon_deg: 139.6503, alt_km: 0.04}
  - {id: singapore, lat_deg: 1.3521, lon_deg: 103.8198, alt_km: 0.03}
  - {id: sao_paulo, lat_deg: -23.5558, lon_deg: -46.6396, alt_km: 0.76}
  - {id: johannesburg, lat_deg: -26.2041, lon_deg: 28.0473, alt_km: 1.75}
  - {id: sydney, lat_deg: -33.8688, lon_deg: 151.2093, alt_km: 0.06}
  - {id: frankfurt, lat_deg: 50.1109, lon_deg: 8.6821, alt_km: 0.11}

environment:
  eclipse: true
  atmosphere: exponential
  apply_drag: false

power:
  panel_area_m2: 8.0
  panel_efficiency: 0.28
  battery_capacity_wh: 200.0
  initial_soc: 0.75
  platform_idle_w: 50.0

thermal:
  mass_kg: 300.0
  initial_temp_k: 290.0

radiation:
  model: saa_heuristic
  peak_flux_cm2_s: 2000.0

compute:
  enabled: true
  flops: 2.0e13
  idle_w: 90.0
  busy_w: 450.0
  min_soc: 0.12
  jobs:
    - {id: infer-a, flops: 4.0e14}
    - {id: infer-b, flops: 4.0e14}
    - {id: down-london, flops: 5.0e14, dest_gs: london}
    - {id: train-a, flops: 8.0e14}

shells:
  # Classic Starlink Gen1-density mid-inclination shells (72 x 22 = 1584)
  - id: sl_550_53
    altitude_km: 550.0
    inclination_deg: 53.0
    n_planes: 72
    n_sats_per_plane: 22
    phasing_f: 17
  - id: sl_540_532
    altitude_km: 540.0
    inclination_deg: 53.2
    n_planes: 72
    n_sats_per_plane: 22
    phasing_f: 17
  - id: sl_530_43
    altitude_km: 530.0
    inclination_deg: 43.0
    n_planes: 72
    n_sats_per_plane: 22
    phasing_f: 17
  - id: sl_520_43
    altitude_km: 520.0
    inclination_deg: 43.0
    n_planes: 72
    n_sats_per_plane: 22
    phasing_f: 17
  - id: sl_510_53
    altitude_km: 510.0
    inclination_deg: 53.0
    n_planes: 72
    n_sats_per_plane: 22
    phasing_f: 17
  # Higher-inclination shells (36 x 20 = 720)
  - id: sl_570_70
    altitude_km: 570.0
    inclination_deg: 70.0
    n_planes: 36
    n_sats_per_plane: 20
    phasing_f: 11
  - id: sl_560_70
    altitude_km: 560.0
    inclination_deg: 70.0
    n_planes: 36
    n_sats_per_plane: 20
    phasing_f: 11
  # Extra mid-inclination filler (36 x 14 = 504)
  - id: sl_580_53
    altitude_km: 580.0
    inclination_deg: 53.0
    n_planes: 36
    n_sats_per_plane: 14
    phasing_f: 11
  # Near-polar / SSO-like (12 x 12 = 144)
  - id: sl_560_sso
    altitude_km: 560.0
    inclination_deg: 97.6
    n_planes: 12
    n_sats_per_plane: 12
    phasing_f: 7
# Sum: 1584*5 + 720*2 + 504 + 144 = 10008
