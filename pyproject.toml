[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scs-sim"
version = "0.1.0"
description = "Industrial-grade Starlink-like compute constellation simulator (Phase 1: orbits + Walker)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SCS-Sim contributors" }]
keywords = ["constellation", "walker", "sgp4", "leo", "orbit", "starlink"]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "sgp4>=2.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional GPU-batch SGP4 later; not required for Phase 1 / Windows.
jax = ["jax>=0.4"]

[project.scripts]
scs-demo = "scs_sim.demo:main"

[project.urls]
Documentation = "docs/ARCHITECTURE.md"

[tool.setuptools.packages.find]
include = ["scs_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
