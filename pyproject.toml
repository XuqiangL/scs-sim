[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scs-sim"
version = "0.8.1"
description = "Industrial-grade Starlink-like compute constellation simulator (catalog + 10k bench)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SCS-Sim contributors" }]
keywords = ["constellation", "walker", "sgp4", "leo", "orbit", "starlink"]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "sgp4>=2.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fastapi>=0.110", "httpx>=0.27"]
viz = ["matplotlib>=3.8"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
# Optional GPU-batch SGP4 later; not required for Phase 1 / Windows.
jax = ["jax>=0.4"]

[project.scripts]
scs-sim = "scs_sim.cli:main"
scs-demo = "scs_sim.demo:main"
scs-viz = "scs_sim.demo_viz:main"
scs-api = "scs_sim.api.__main__:main"
scs-catalog = "scs_sim.catalog.__main__:main"
scs-bench = "scs_sim.bench:main"

[project.urls]
Documentation = "docs/ARCHITECTURE.md"

[tool.setuptools.packages.find]
include = ["scs_sim*"]

[tool.setuptools.package-data]
scs_sim = ["viz/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: 10k-scale or long-running campaign tests",
]
